name: MoJoins
version: '${version}'
main: ru.mairwunnx.mojoins.MoJoinsPlugin
api-version: '26.3'
load: POSTWORLD
authors: [ MairwunNx ]
description: "Join and quit messages in each player’s language, picked by their IP: a welcome for newcomers, sounds, particles, and an optional firework."
website: "https://github.com/MairwunNx/mojoins"
permissions:
  mojoins.admin:
    description: Use /mojoins reload and /mojoins locale
    default: op
  mojoins.silent:
    description: Join and leave without messages, after /mojoins silent
    default: op
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
