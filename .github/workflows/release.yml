name: Release

# Run by hand: Actions → Release → Run workflow, with the new version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 2.0.0"
        required: true
      modrinth:
        description: "Also publish to Modrinth (needs the MODRINTH_TOKEN secret)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$VERSION isn't a version like 2.0.0"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released"; exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build -PreleaseVersion="$VERSION"
      - name: Publish the GitHub release
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Mo’Joins $VERSION" --generate-notes "build/libs/mojoins-$VERSION.jar"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to Modrinth
        if: inputs.modrinth
        run: ./gradlew modrinth -PreleaseVersion="$VERSION"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
